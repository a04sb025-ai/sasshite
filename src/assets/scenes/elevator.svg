<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-label="エレベーターの中から、閉まりかけた扉の向こうを走ってくる人を見る場面">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9b8b2"/><stop offset=".45" stop-color="#ededE9"/><stop offset="1" stop-color="#979a98"/></linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0eee9"/><stop offset=".58" stop-color="#d8d4cc"/><stop offset="1" stop-color="#aaa59d"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c5bd"/><stop offset="1" stop-color="#8d8a84"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#252525" flood-opacity=".24"/></filter>
  </defs>

  <!-- inside of the elevator -->
  <rect width="420" height="620" fill="#777a78"/>
  <rect x="0" y="0" width="76" height="620" fill="url(#metal)"/>
  <rect x="310" y="0" width="110" height="620" fill="url(#metal)"/>
  <rect x="76" y="0" width="234" height="620" fill="#535654"/>

  <!-- hallway seen through the closing doors -->
  <rect x="92" y="42" width="202" height="500" fill="url(#hall)"/>
  <path d="M92 360 L294 360 L310 542 L76 542 Z" fill="url(#floor)"/>
  <path d="M192 360 L184 542 M240 360 L258 542 M143 360 L111 542" stroke="#b7b2aa" stroke-width="2"/>
  <rect x="108" y="80" width="170" height="12" rx="6" fill="#f9f7f0"/>
  <rect x="125" y="126" width="134" height="8" rx="4" fill="#f9f7f0" opacity=".9"/>
  <rect x="111" y="166" width="45" height="151" rx="4" fill="#e7e3db" stroke="#bdb9b1" stroke-width="3"/>
  <rect x="231" y="166" width="44" height="151" rx="4" fill="#e7e3db" stroke="#bdb9b1" stroke-width="3"/>

  <!-- person outside, clearly moving toward the elevator -->
  <g filter="url(#shadow)">
    <ellipse cx="203" cy="226" rx="25" ry="29" fill="#d9aa83"/>
    <path d="M178 223 Q181 194 204 194 Q230 196 228 225 Q213 211 190 211 Q184 219 178 223Z" fill="#26292c"/>
    <path d="M174 262 Q205 240 234 262 L241 351 Q217 366 183 351 Z" fill="#32383d"/>
    <path d="M188 266 L203 304 L217 266" fill="#f1efea"/>
    <path d="M203 268 L205 311" stroke="#665049" stroke-width="6"/>
    <path d="M183 285 Q151 316 145 351" stroke="#d7a77f" stroke-width="11" stroke-linecap="round"/>
    <path d="M233 284 Q263 308 270 340" stroke="#d7a77f" stroke-width="11" stroke-linecap="round"/>
    <path d="M190 350 Q165 402 154 462" stroke="#292e32" stroke-width="20" stroke-linecap="round"/>
    <path d="M225 351 Q247 405 266 455" stroke="#292e32" stroke-width="20" stroke-linecap="round"/>
    <path d="M144 463 L166 467 M258 458 L280 451" stroke="#171a1c" stroke-width="11" stroke-linecap="round"/>
    <path d="M153 326 l-18 6 10 20" fill="none" stroke="#3d4449" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- closing door panels in the foreground -->
  <rect x="76" y="0" width="62" height="548" fill="url(#metal)"/>
  <rect x="253" y="0" width="57" height="548" fill="url(#metal)"/>
  <line x1="138" y1="0" x2="138" y2="548" stroke="#777b78" stroke-width="3"/>
  <line x1="253" y1="0" x2="253" y2="548" stroke="#777b78" stroke-width="3"/>
  <rect x="132" y="0" width="8" height="548" fill="#4d504e" opacity=".52"/>
  <rect x="251" y="0" width="8" height="548" fill="#4d504e" opacity=".52"/>

  <!-- elevator threshold, camera/player is on this side -->
  <path d="M56 542 H326 L390 620 H0 Z" fill="#6f706d"/>
  <path d="M74 542 H309 L338 575 H48 Z" fill="#d1d0cb"/>
  <line x1="79" y1="548" x2="303" y2="548" stroke="#4d4f4d" stroke-width="4"/>

  <!-- inside control panel; live buttons are overlaid by HTML -->
  <g filter="url(#shadow)">
    <rect x="322" y="306" width="79" height="184" rx="12" fill="#666a68" stroke="#d7d7d2" stroke-width="3"/>
    <circle cx="361" cy="372" r="26" fill="#292c2b" stroke="#c5c7c4" stroke-width="3"/>
    <circle cx="361" cy="435" r="26" fill="#292c2b" stroke="#c5c7c4" stroke-width="3"/>
    <circle cx="361" cy="325" r="5" fill="#d7c65a"/>
  </g>

  <!-- orange sleeve/hand makes the player's position inside the car explicit -->
  <path d="M420 520 C401 493 390 474 378 458 L355 473 C369 500 385 532 401 553 Z" fill="#b96036"/>
  <path d="M379 457 C368 448 358 448 351 454 C347 460 351 470 359 476 C367 481 378 474 383 467 Z" fill="#d9aa83"/>
</svg>
