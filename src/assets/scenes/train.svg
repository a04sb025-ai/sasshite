<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-label="電車内で、座っている人の隣席にバッグがあり、その前に乗客が立っている場面">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f2ec"/><stop offset="1" stop-color="#d7d8d3"/></linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe1ee"/><stop offset="1" stop-color="#eef4f4"/></linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#607a89"/><stop offset="1" stop-color="#405a68"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7c2b9"/><stop offset="1" stop-color="#96938d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#272a2a" flood-opacity=".22"/></filter>
  </defs>

  <rect width="420" height="620" fill="#e7e4dc"/>
  <rect x="16" y="24" width="388" height="478" rx="22" fill="url(#wall)"/>
  <rect x="34" y="66" width="352" height="210" rx="14" fill="#b8b9b5"/>
  <rect x="48" y="80" width="154" height="180" rx="10" fill="url(#window)"/>
  <path d="M48 205 C88 184 124 191 162 176 C177 171 190 173 202 179 L202 260 L48 260 Z" fill="#b7d5ca" opacity=".76"/>
  <path d="M48 220 C92 205 121 212 160 199 C177 193 190 196 202 201 L202 260 L48 260 Z" fill="#8fb8a1" opacity=".62"/>
  <rect x="216" y="80" width="154" height="180" rx="10" fill="#d5d7d6"/>
  <rect x="229" y="94" width="128" height="152" rx="6" fill="url(#window)"/>
  <line x1="293" y1="94" x2="293" y2="246" stroke="#8f9695" stroke-width="5"/>
  <rect x="24" y="280" width="372" height="14" rx="7" fill="#777c79"/>
  <rect x="55" y="292" width="8" height="175" rx="4" fill="#9ea3a0"/>
  <rect x="300" y="292" width="8" height="216" rx="4" fill="#9ea3a0"/>

  <g stroke="#777c79" stroke-width="5" fill="none">
    <line x1="84" y1="28" x2="84" y2="97"/><line x1="154" y1="28" x2="154" y2="97"/><line x1="284" y1="28" x2="284" y2="97"/><line x1="347" y1="28" x2="347" y2="97"/>
  </g>
  <g fill="#faf9f6" stroke="#777c79" stroke-width="4">
    <path d="M68 97 Q84 118 100 97 Q96 133 84 137 Q72 133 68 97Z"/><path d="M138 97 Q154 118 170 97 Q166 133 154 137 Q142 133 138 97Z"/>
    <path d="M268 97 Q284 118 300 97 Q296 133 284 137 Q272 133 268 97Z"/><path d="M331 97 Q347 118 363 97 Q359 133 347 137 Q335 133 331 97Z"/>
  </g>

  <path d="M22 472 L398 472 L420 620 L0 620 Z" fill="url(#floor)"/>
  <path d="M98 472 L74 620 M208 472 L202 620 M318 472 L338 620" stroke="#bab7b0" stroke-width="2" opacity=".7"/>

  <g filter="url(#shadow)">
    <rect x="34" y="338" width="274" height="98" rx="23" fill="url(#seat)"/>
    <rect x="34" y="425" width="274" height="76" rx="18" fill="#4c6674"/>
    <path d="M126 345 V495 M216 345 V495" stroke="#8ba0aa" stroke-width="3" opacity=".65"/>
    <rect x="38" y="496" width="266" height="12" rx="6" fill="#2f424c" opacity=".75"/>
  </g>

  <!-- player: orange top, seated at the left side -->
  <g filter="url(#shadow)">
    <ellipse cx="92" cy="328" rx="30" ry="34" fill="#e1b38d"/>
    <path d="M62 325 Q62 286 94 286 Q126 289 123 327 Q106 310 77 312 Q69 323 62 325Z" fill="#3a302a"/>
    <path d="M59 361 Q91 339 121 362 L133 427 Q111 443 69 431 Z" fill="#bb6336"/>
    <path d="M73 421 Q102 430 125 418 L142 486 L112 494 L91 447 L74 494 L45 485 Z" fill="#ece7df"/>
    <path d="M66 373 Q55 398 66 414 M117 374 Q132 397 121 415" stroke="#d7aa86" stroke-width="13" stroke-linecap="round"/>
    <path d="M72 414 Q91 426 120 414" stroke="#d7aa86" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- standing passenger waiting for a seat -->
  <g filter="url(#shadow)">
    <ellipse cx="329" cy="278" rx="27" ry="31" fill="#dcb08b"/>
    <path d="M303 275 Q305 242 331 242 Q357 245 355 276 Q341 260 316 260 Q309 270 303 275Z" fill="#24272a"/>
    <path d="M297 315 Q329 292 359 315 L366 408 Q344 422 306 413 Z" fill="#42494f"/>
    <path d="M313 323 L328 365 L342 323" fill="#f2f0ec"/>
    <path d="M328 323 L330 369" stroke="#6e5a50" stroke-width="7"/>
    <path d="M309 405 L306 533 M351 406 L365 533" stroke="#31363a" stroke-width="24" stroke-linecap="round"/>
    <path d="M303 534 L324 534 M353 534 L376 534" stroke="#202326" stroke-width="12" stroke-linecap="round"/>
    <path d="M302 331 Q281 355 285 392" stroke="#d7aa86" stroke-width="12" stroke-linecap="round"/>
    <path d="M359 331 Q374 358 365 388" stroke="#d7aa86" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="329" cy="300" rx="4" ry="3" fill="#6a4e40" opacity=".8"/>
  </g>

  <!-- visual cue that the adjacent middle seat is where the movable bag starts -->
  <rect x="150" y="366" width="72" height="52" rx="16" fill="#78909b" opacity=".32"/>
  <path d="M236 294 H288" stroke="#7b807e" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <circle cx="375" cy="315" r="6" fill="#b54f42"/>
  <circle cx="375" cy="336" r="6" fill="#4c8a68"/>
</svg>
