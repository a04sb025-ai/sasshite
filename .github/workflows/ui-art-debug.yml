name: UI art debug export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload existing scene artwork
        uses: actions/upload-artifact@v4
        with:
          name: scene-art-debug
          path: public/scene-art/*.png
