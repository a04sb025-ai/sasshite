name: Generate scene artwork

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Artwork to generate
        required: true
        type: choice
        options:
          - train-redesign-candidate

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-generation dependencies
        run: python -m pip install --disable-pip-version-check openai pillow
      - name: Generate one train redesign candidate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p output/imagegen/scene-art
          cat prompts/imagegen/character.txt prompts/imagegen/train.txt > "$RUNNER_TEMP/train-prompt.txt"
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py generate \
            --prompt-file "$RUNNER_TEMP/train-prompt.txt" \
            --model gpt-image-2 --quality high --size 1024x1536 \
            --n 1 \
            --out output/imagegen/scene-art/train-redesign-candidate.png
      - name: Upload artwork for human review
        uses: actions/upload-artifact@v4
        with:
          name: train-redesign-candidate
          path: output/imagegen/scene-art/train-redesign-candidate.png
          if-no-files-found: error
