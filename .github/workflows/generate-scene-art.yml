name: Generate scene artwork

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Artwork to generate
        required: true
        type: choice
        options:
          - train-redesign-candidate
          - train-layer-assets
          - train-layer-assets-v2
          - train-layer-assets-v3
          - commit-train-redesign

jobs:
  generate-candidate:
    if: ${{ inputs.mode == 'train-redesign-candidate' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-generation dependencies
        run: python -m pip install --disable-pip-version-check openai pillow
      - name: Generate one train redesign candidate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p output/imagegen/scene-art
          cat prompts/imagegen/character.txt prompts/imagegen/train.txt > "$RUNNER_TEMP/train-prompt.txt"
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py generate \
            --prompt-file "$RUNNER_TEMP/train-prompt.txt" \
            --model gpt-image-2 --quality high --size 1024x1536 \
            --n 1 \
            --out output/imagegen/scene-art/train-redesign-candidate.png
      - name: Upload artwork for human review
        uses: actions/upload-artifact@v4
        with:
          name: train-redesign-candidate
          path: output/imagegen/scene-art/train-redesign-candidate.png
          if-no-files-found: error

  generate-train-layer-assets:
    if: ${{ inputs.mode == 'train-layer-assets' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-generation dependencies
        run: python -m pip install --disable-pip-version-check openai pillow
      - name: Generate layered train assets from the approved composite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p output/imagegen/train-layers/raw output/imagegen/train-layers/final

          # 1) Background plate: preserve the approved train composition while removing people and bags.
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py edit \
            --image public/scene-art/train.png \
            --prompt-file prompts/imagegen/train-layer-background.txt \
            --model gpt-image-2 --quality high --size 1024x1536 \
            --n 1 --output-format png \
            --out output/imagegen/train-layers/final/train-background.png

          # 2-5) Transparent gameplay sprites. gpt-image-1.5 is used because this repo's
          # image CLI intentionally routes transparent output through that model.
          for asset in player-seated npc-standing npc-seated bag; do
            env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py edit \
              --image public/scene-art/train.png \
              --prompt-file "prompts/imagegen/train-layer-${asset}.txt" \
              --model gpt-image-1.5 --quality high --size 1024x1536 \
              --background transparent --output-format png --input-fidelity high \
              --n 1 \
              --out "output/imagegen/train-layers/raw/train-${asset}.png"
          done

          # Trim transparent margins so React can position and drag the sprites directly.
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          raw_dir = Path('output/imagegen/train-layers/raw')
          out_dir = Path('output/imagegen/train-layers/final')
          out_dir.mkdir(parents=True, exist_ok=True)

          names = ['player-seated', 'npc-standing', 'npc-seated', 'bag']
          for name in names:
              src = raw_dir / f'train-{name}.png'
              dst = out_dir / f'train-{name}.png'
              with Image.open(src).convert('RGBA') as image:
                  alpha = image.getchannel('A')
                  bbox = alpha.getbbox()
                  if bbox is None:
                      raise SystemExit(f'No visible pixels in {src}')
                  left, top, right, bottom = bbox
                  pad = max(8, round(max(right-left, bottom-top) * 0.04))
                  left = max(0, left-pad)
                  top = max(0, top-pad)
                  right = min(image.width, right+pad)
                  bottom = min(image.height, bottom+pad)
                  cropped = image.crop((left, top, right, bottom))
                  cropped.save(dst, 'PNG')
                  print(f'{dst}: {cropped.width}x{cropped.height}')
          PY

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = [
              'train-background.png',
              'train-player-seated.png',
              'train-npc-standing.png',
              'train-npc-seated.png',
              'train-bag.png',
          ]
          root = Path('output/imagegen/train-layers/final')
          for name in expected:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing generated asset: {path}')
              with Image.open(path) as image:
                  print(f'{name}: mode={image.mode}, size={image.size}')
                  if name != 'train-background.png' and image.mode != 'RGBA':
                      raise SystemExit(f'{name} is not RGBA')
          PY
      - name: Upload train layer assets for human review
        uses: actions/upload-artifact@v4
        with:
          name: train-layer-assets
          path: output/imagegen/train-layers/final/*.png
          if-no-files-found: error

  generate-train-layer-assets-v2:
    if: ${{ inputs.mode == 'train-layer-assets-v2' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-generation dependencies
        run: python -m pip install --disable-pip-version-check openai pillow
      - name: Build master-aligned train layer assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          raw=output/imagegen/train-layers-v2/raw
          final=output/imagegen/train-layers-v2/final
          mkdir -p "$raw" "$final"

          # The approved image is the only composition master. Generate one locked clean
          # plate; unchanged master pixels are subsequently used for the three existing assets.
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py edit \
            --image public/scene-art/train.png \
            --prompt-file prompts/imagegen/train-layer-v2-background.txt \
            --model gpt-image-2 --quality high --size 1024x1536 \
            --n 1 --output-format png --out "$raw/train-background.png"

          # Generate the required new pose as a full scene first. Supplying both the fixed
          # plate and master keeps identity, scale, perspective, and seat contact anchored.
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py edit \
            --image "$raw/train-background.png" \
            --image public/scene-art/train.png \
            --prompt-file prompts/imagegen/train-layer-v2-npc-seated-composite.txt \
            --model gpt-image-2 --quality high --size 1024x1536 \
            --n 1 --output-format png --out "$raw/train-npc-seated-composite.png"

          # Difference extraction preserves master pixels for player/standing NPC/bag.
          # Outputs retain the complete master canvas; there is deliberately no trimming.
          python scripts/image-processing/build_train_layers_v2.py \
            --master public/scene-art/train.png \
            --background "$raw/train-background.png" \
            --seated-composite "$raw/train-npc-seated-composite.png" \
            --out-dir "$final"
      - name: Upload master-aligned assets and previews
        uses: actions/upload-artifact@v4
        with:
          name: train-layer-assets-v2
          path: output/imagegen/train-layers-v2/final/*.png
          if-no-files-found: error

  generate-train-layer-assets-v3:
    if: ${{ inputs.mode == 'train-layer-assets-v3' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check openai pillow
      - name: Test common layer extraction and quality gates (no API)
        run: python -m unittest discover -s scripts/image-processing/tests -v
      - name: Generate explicit-mask train layers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          raw=output/imagegen/train-layers-v3/raw
          final=output/imagegen/train-layers-v3/final
          mkdir -p "$raw" "$final"

          # Call 1/5: only the background is an opaque edit.
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py edit \
            --image public/scene-art/train.png \
            --prompt-file prompts/imagegen/train-layer-v3-background.txt \
            --model gpt-image-2 --quality high --size 1024x1536 \
            --output-format png --n 1 --out "$raw/train-background-v3.png"

          # Calls 2-4/5: request transparent isolation RGBA. Both API RGB and API alpha
          # are retained; the completed master is reference-only and is never pasted through a mask.
          for asset in player-seated npc-standing bag; do
            env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py edit \
              --image public/scene-art/train.png \
              --prompt-file "prompts/imagegen/train-layer-v3-${asset}.txt" \
              --model gpt-image-1.5 --quality high --size 1024x1536 \
              --background transparent --output-format png --input-fidelity high \
              --n 1 --out "$raw/train-${asset}-v3-raw.png"
          done

          # Call 5/5: explicit transparent isolation for the only newly posed subject.
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py edit \
            --image "$raw/train-background-v3.png" \
            --image public/scene-art/train.png \
            --prompt-file prompts/imagegen/train-layer-v3-npc-seated.txt \
            --model gpt-image-1.5 --quality high --size 1024x1536 \
            --background transparent --output-format png --input-fidelity high \
            --n 1 --out "$raw/train-npc-seated-v3-raw.png"

          python scripts/image-processing/build_train_layers_v3.py \
            --master public/scene-art/train.png \
            --background "$raw/train-background-v3.png" \
            --raw-dir "$raw" --out-dir "$final"
      - name: Upload v3 assets, masks, and previews
        uses: actions/upload-artifact@v4
        with:
          name: train-layer-assets-v3
          path: |
            output/imagegen/train-layers-v3/final/*.png
            output/imagegen/train-layers-v3/final/quality-report.json
          if-no-files-found: error

  commit-train-redesign:
    if: ${{ inputs.mode == 'commit-train-redesign' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-generation dependencies
        run: python -m pip install --disable-pip-version-check openai pillow
      - name: Generate one train redesign candidate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p output/imagegen/scene-art
          cat prompts/imagegen/character.txt prompts/imagegen/train.txt > "$RUNNER_TEMP/train-prompt.txt"
          env -u OPENAI_BASE_URL python scripts/imagegen/image_gen.py generate \
            --prompt-file "$RUNNER_TEMP/train-prompt.txt" \
            --model gpt-image-2 --quality high --size 1024x1536 \
            --n 1 \
            --out output/imagegen/scene-art/train-redesign-candidate.png
      - name: Commit redesigned train artwork to dedicated branch
        run: |
          cp output/imagegen/scene-art/train-redesign-candidate.png public/scene-art/train.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C train-redesign-image
          git add public/scene-art/train.png
          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "public/scene-art/train.png" ]; then
            echo "Unexpected staged files; refusing to push."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Generated artwork is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update train stage artwork"
          git push --force-with-lease origin HEAD:train-redesign-image
