name: AI Game Director v2 low-cost

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: analyze
        type: choice
        options:
          - analyze
          - implement
      model_tier:
        description: "Model tier for this manual run"
        required: true
        default: economy
        type: choice
        options:
          - economy
          - balanced
      objective:
        description: "Optional focus for this single improvement cycle"
        required: false
        type: string
  schedule:
    # GitHub wakes the director every hour. The preflight below uses no OpenAI
    # API and only allows an AI call in four fixed JST windows per day.
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ai-game-director-low-cost
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run_ai: ${{ steps.policy.outputs.run_ai }}
      run_mode: ${{ steps.policy.outputs.run_mode }}
      ai_model: ${{ steps.policy.outputs.ai_model }}
      ai_reasoning: ${{ steps.policy.outputs.ai_reasoning }}
      auto_publish: ${{ steps.policy.outputs.auto_publish }}
      objective: ${{ steps.policy.outputs.objective }}
      reason: ${{ steps.policy.outputs.reason }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout policy files only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            docs/automation
          sparse-checkout-cone-mode: true

      - name: Free hourly preflight
        id: policy
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MODEL_TIER: ${{ inputs.model_tier }}
          INPUT_OBJECTIVE: ${{ inputs.objective }}
        run: |
          set -euo pipefail

          RUN_AI=false
          RUN_MODE="${INPUT_MODE:-analyze}"
          AI_MODEL="gpt-5.6-luna"
          AI_REASONING="low"
          AUTO_PUBLISH=false
          OBJECTIVE="${INPUT_OBJECTIVE:-}"
          REASON=""

          PENDING_DIRECTOR_PRS=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 50 \
            --json title,headRefName | jq '[.[] | select((.title | startswith("AI Game Director:")) or (.headRefName | startswith("agent/hourly-improve-")) or (.headRefName | startswith("agent/review-improve-")))] | length')

          LATEST_CI=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow CI --branch main --limit 1 \
            --json status,conclusion 2>/dev/null || printf '[]')
          CI_STATUS=$(printf '%s' "$LATEST_CI" | jq -r '.[0].status // "missing"')
          CI_CONCLUSION=$(printf '%s' "$LATEST_CI" | jq -r '.[0].conclusion // "missing"')

          BACKLOG_ITEM=""
          if [ -f docs/automation/low-cost-backlog.md ]; then
            BACKLOG_ITEM=$(grep -m1 '^- \[ \] ' docs/automation/low-cost-backlog.md | sed 's/^- \[ \] //' || true)
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RUN_AI=true
            AUTO_PUBLISH=false
            if [ "${INPUT_MODEL_TIER:-economy}" = "balanced" ]; then
              AI_MODEL="gpt-5.6-terra"
              AI_REASONING="medium"
            fi
            REASON="manual run requested"
          else
            RUN_MODE="implement"
            AI_MODEL="gpt-5.6-luna"
            AI_REASONING="low"
            AUTO_PUBLISH=true

            JST_HOUR=$(TZ=Asia/Tokyo date +%H)
            case "$JST_HOUR" in
              03|09|15|21)
                ;;
              *)
                REASON="free hourly check only; next AI window is one of 03/09/15/21 JST"
                ;;
            esac

            if [ -z "$REASON" ] && [ "$PENDING_DIRECTOR_PRS" -gt 0 ]; then
              REASON="an AI Game Director PR is still open, so no new paid run is started"
            fi

            if [ -z "$REASON" ] && [ "$CI_STATUS" != "completed" ] && [ "$CI_STATUS" != "missing" ]; then
              REASON="latest main CI is still running"
            fi

            if [ -z "$REASON" ]; then
              if [ "$CI_STATUS" = "completed" ] && [ "$CI_CONCLUSION" != "success" ]; then
                OBJECTIVE="LOW-COST SCHEDULED REPAIR. The latest main CI is not successful. Find the smallest non-visual, low-risk cause that is inside the scheduled allowlist, fix exactly one issue, and keep all visual/content areas untouched."
                RUN_AI=true
              elif [ -n "$BACKLOG_ITEM" ]; then
                OBJECTIVE="LOW-COST SCHEDULED IMPROVEMENT. Work on exactly this backlog item: ${BACKLOG_ITEM} Do not substitute another task. If it is already satisfied, verify the evidence and mark only that backlog item complete instead of inventing work."
                RUN_AI=true
              else
                REASON="low-cost backlog is empty; hourly watcher stays free until the queue is replenished"
              fi
            fi
          fi

          {
            echo "run_ai=$RUN_AI"
            echo "run_mode=$RUN_MODE"
            echo "ai_model=$AI_MODEL"
            echo "ai_reasoning=$AI_REASONING"
            echo "auto_publish=$AUTO_PUBLISH"
            echo "reason=$REASON"
            echo "objective<<EOF"
            printf '%s\n' "$OBJECTIVE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Low-cost hourly preflight"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Pending Director PRs: ${PENDING_DIRECTOR_PRS}"
            echo "- Latest main CI: ${CI_STATUS}/${CI_CONCLUSION}"
            echo "- Backlog candidate: ${BACKLOG_ITEM:-none}"
            echo "- OpenAI call this hour: ${RUN_AI}"
            echo "- Model if called: ${AI_MODEL} (${AI_REASONING})"
            echo "- Auto publish safe change: ${AUTO_PUBLISH}"
            if [ -n "$REASON" ]; then echo "- Skip/decision reason: ${REASON}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  game-director:
    needs: preflight
    if: ${{ needs.preflight.outputs.run_ai == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUN_MODE: ${{ needs.preflight.outputs.run_mode }}
      AI_MODEL: ${{ needs.preflight.outputs.ai_model }}
      AI_REASONING: ${{ needs.preflight.outputs.ai_reasoning }}
      AUTO_PUBLISH: ${{ needs.preflight.outputs.auto_publish }}
      OBJECTIVE: ${{ needs.preflight.outputs.objective }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Verify Codex authentication input
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is empty. Repository secret OPENAI_API_KEY must contain a valid OpenAI API key." >&2
            exit 1
          fi
          echo "Codex API credential is present."

      - name: Capture current open PRs
        run: |
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 30 \
            --json number,title,headRefName,baseRefName,url,body > /tmp/open-prs.json

      - name: Build Game Director prompt
        run: |
          cp prompts/codex/game-director-v1.md /tmp/game-director-prompt.md
          {
            echo
            echo "## この実行で指定された追加目的"
            printf '%s\n' "${OBJECTIVE:-指定なし}"
            echo
            echo "## 実行コスト方針"
            echo "- model: ${AI_MODEL}"
            echo "- reasoning: ${AI_REASONING}"
            echo "- scheduled auto publish: ${AUTO_PUBLISH}"
            echo "- 目的外の探索を広げず、必要なファイルだけ読み、1件だけ処理すること。"
            if [ "${AUTO_PUBLISH}" = "true" ]; then
              echo "- これは低コスト定期実行。Visual/UI/コンテンツ制作を行わず、指定backlogまたはCI修復だけを扱う。"
              echo "- backlog項目が既に満たされている場合は、根拠を確認して docs/automation/low-cost-backlog.md の該当1項目だけをチェック済みにしてよい。"
            fi
            echo
            echo "## 現在openのPR一覧"
            cat /tmp/open-prs.json
          } >> /tmp/game-director-prompt.md

      - name: Analyze one improvement
        if: ${{ env.RUN_MODE == 'analyze' }}
        run: |
          codex exec --ephemeral --sandbox danger-full-access \
            -m "$AI_MODEL" \
            -c model_reasoning_effort="$AI_REASONING" \
            --output-last-message /tmp/game-director-result.md \
            - < /tmp/game-director-prompt.md
          cat /tmp/game-director-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare improvement branch
        if: ${{ env.RUN_MODE == 'implement' }}
        run: |
          if [ "${AUTO_PUBLISH}" = "true" ]; then
            BRANCH="agent/hourly-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            BRANCH="agent/review-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

      - name: Implement exactly one improvement
        if: ${{ env.RUN_MODE == 'implement' }}
        run: |
          codex exec --ephemeral --sandbox danger-full-access \
            -m "$AI_MODEL" \
            -c model_reasoning_effort="$AI_REASONING" \
            --output-last-message /tmp/game-director-result.md \
            - < /tmp/game-director-prompt.md

      - name: Enforce autonomous safety boundaries
        if: ${{ env.RUN_MODE == 'implement' }}
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "Codex produced no repository changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MAX_FILES=8
          if [ "${AUTO_PUBLISH}" = "true" ]; then MAX_FILES=6; fi
          if [ "${#files[@]}" -gt "$MAX_FILES" ]; then
            echo "AI cycle exceeded ${MAX_FILES}-file limit." >&2
            exit 1
          fi

          protected_pattern='^(\.github/workflows/|AGENTS\.md$|docs/game-vision\.md$|docs/age-modes\.md$|docs/evaluation-rubric\.md$|docs/autonomous-development\.md$|docs/release-readiness\.md$|docs/prototype-milestone\.md$|package\.json$|package-lock\.json$|wrangler\.jsonc$|prompts/|scripts/imagegen/|public/|src/components/|src/styles\.css$|src/assets/scenes/|src/prototypes/|src/App\.tsx$|src/data/ageModes\.ts$|src/data/scenes\.ts$|src/types\.ts$)'
          for file in "${files[@]}"; do
            if [[ "$file" =~ $protected_pattern ]]; then
              echo "Attempted protected, visual, content, or governance change: $file" >&2
              exit 1
            fi
          done

          if [ "${AUTO_PUBLISH}" = "true" ]; then
            for file in "${files[@]}"; do
              case "$file" in
                src/game/*|src/data/scenePresentationPolicy.ts|src/data/scenePresentationPolicy.test.ts|docs/current-plan.md|docs/automation/low-cost-backlog.md)
                  ;;
                *)
                  echo "Scheduled auto-publish attempted file outside strict allowlist: $file" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          {
            echo "### Changed files"
            printf -- '- `%s`\n' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run independent validation
        if: ${{ env.RUN_MODE == 'implement' && env.NO_CHANGES != 'true' }}
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit, rebase, and revalidate
        if: ${{ env.RUN_MODE == 'implement' && env.NO_CHANGES != 'true' }}
        run: |
          git add -A
          if [ "${AUTO_PUBLISH}" = "true" ]; then
            git commit -m "AI Game Director: low-cost improvement"
          else
            git commit -m "AI Game Director: review candidate"
          fi
          git fetch origin main
          git rebase origin/main
          npm run typecheck
          npm test
          npm run build
          echo "VALIDATED_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Push candidate and publish or request review
        if: ${{ env.RUN_MODE == 'implement' && env.NO_CHANGES != 'true' }}
        run: |
          git push --set-upstream origin "$BRANCH"
          TITLE=$(sed -n 's/^TITLE:[[:space:]]*//p' /tmp/game-director-result.md | head -n 1)
          if [ -z "$TITLE" ]; then TITLE="low-cost improvement"; fi
          {
            echo "AI Game Director v2 low-cost が作成した1改善候補です。"
            echo
            echo "Model: ${AI_MODEL} / reasoning: ${AI_REASONING}"
            echo
            if [ "${AUTO_PUBLISH}" = "true" ]; then
              echo "定期実行の厳格なallowlistとtypecheck/test/buildを通過した非Visual変更です。"
            else
              echo "**mainへは自動反映しません。差分 / Preview確認後に判断してください。**"
            fi
            echo
            cat /tmp/game-director-result.md
          } > /tmp/game-director-pr.md

          if [ "${AUTO_PUBLISH}" = "true" ]; then
            PR_URL=$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "$BRANCH" \
              --title "AI Game Director: ${TITLE}" \
              --body-file /tmp/game-director-pr.md)

            git fetch origin main
            CURRENT_MAIN_SHA=$(git rev-parse origin/main)
            if [ "$CURRENT_MAIN_SHA" != "$VALIDATED_MAIN_SHA" ]; then
              echo "main moved after validation; leaving $PR_URL open for review instead of auto-merging." >> "$GITHUB_STEP_SUMMARY"
            else
              gh pr merge "$PR_URL" --squash --delete-branch
              echo "Strict-scope low-cost improvement merged through PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "$BRANCH" \
              --draft \
              --title "AI Game Director: ${TITLE}" \
              --body-file /tmp/game-director-pr.md
          fi

      - name: Summarize result
        if: ${{ always() && env.RUN_MODE == 'implement' }}
        run: |
          if [ -f /tmp/game-director-result.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/game-director-result.md >> "$GITHUB_STEP_SUMMARY"
          fi
