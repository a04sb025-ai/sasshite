name: AI Game Director v1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: analyze
        type: choice
        options:
          - analyze
          - implement
      objective:
        description: "Optional focus for this single improvement cycle"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Phase 1 is manual-only. One candidate may be prepared at a time, and every
# implementation is reviewed through a Draft PR before main changes.
concurrency:
  group: ai-game-director-candidate
  cancel-in-progress: false

jobs:
  game-director:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Verify Codex authentication input
        run: |
          if [ -z "${CODEX_API_KEY:-}" ]; then
            echo "CODEX_API_KEY is empty. Repository secret OPENAI_API_KEY must contain a valid OpenAI API key." >&2
            exit 1
          fi
          echo "Codex API credential is present."

      - name: Resolve run policy
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_OBJECTIVE: ${{ inputs.objective }}
        run: |
          echo "RUN_MODE=${INPUT_MODE:-analyze}" >> "$GITHUB_ENV"
          echo "OBJECTIVE=${INPUT_OBJECTIVE:-}" >> "$GITHUB_ENV"

      - name: Capture current open PRs
        run: |
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 30 \
            --json number,title,headRefName,baseRefName,url,body > /tmp/open-prs.json

      - name: Build Game Director prompt
        run: |
          cp prompts/codex/game-director-v1.md /tmp/game-director-prompt.md
          {
            echo
            echo "## この実行で指定された追加目的"
            printf '%s\n' "${OBJECTIVE:-指定なし}"
            echo
            echo "## 現在openのPR一覧"
            cat /tmp/open-prs.json
          } >> /tmp/game-director-prompt.md

      - name: Analyze one improvement
        if: ${{ env.RUN_MODE == 'analyze' }}
        run: |
          codex exec --ephemeral --sandbox danger-full-access \
            --output-last-message /tmp/game-director-result.md \
            - < /tmp/game-director-prompt.md
          cat /tmp/game-director-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare autonomous improvement branch
        if: ${{ env.RUN_MODE == 'implement' }}
        run: |
          BRANCH="agent/review-improve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

      - name: Implement exactly one improvement
        if: ${{ env.RUN_MODE == 'implement' }}
        run: |
          codex exec --ephemeral --sandbox danger-full-access \
            --output-last-message /tmp/game-director-result.md \
            - < /tmp/game-director-prompt.md

      - name: Enforce autonomous safety boundaries
        if: ${{ env.RUN_MODE == 'implement' }}
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "Codex produced no repository changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${#files[@]}" -gt 8 ]; then
            echo "Autonomous cycle exceeded 8-file limit." >&2
            exit 1
          fi
          protected_pattern='^(\.github/workflows/|AGENTS\.md$|docs/game-vision\.md$|docs/age-modes\.md$|docs/evaluation-rubric\.md$|docs/autonomous-development\.md$|docs/release-readiness\.md$|docs/prototype-milestone\.md$|package\.json$|package-lock\.json$|wrangler\.jsonc$|prompts/imagegen/|scripts/imagegen/|public/|src/components/SceneArtwork\.tsx$|src/components/PlayroomScene\.tsx$|src/styles\.css$|src/assets/scenes/|src/prototypes/)'
          for file in "${files[@]}"; do
            if [[ "$file" =~ $protected_pattern ]]; then
              echo "Attempted protected or human-visual-review change: $file" >&2
              exit 1
            fi
          done
          {
            echo "### Changed files"
            printf -- '- `%s`\n' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run independent validation
        if: ${{ env.RUN_MODE == 'implement' && env.NO_CHANGES != 'true' }}
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit, rebase, and revalidate
        if: ${{ env.RUN_MODE == 'implement' && env.NO_CHANGES != 'true' }}
        run: |
          git add -A
          git commit -m "AI Game Director: review candidate"
          git fetch origin main
          git rebase origin/main
          npm run typecheck
          npm test
          npm run build

      - name: Push candidate and open Draft PR
        if: ${{ env.RUN_MODE == 'implement' && env.NO_CHANGES != 'true' }}
        run: |
          git push --set-upstream origin "$BRANCH"
          TITLE=$(sed -n 's/^TITLE:[[:space:]]*//p' /tmp/game-director-result.md | head -n 1)
          if [ -z "$TITLE" ]; then TITLE="review candidate"; fi
          {
            echo "AI Game Director v1 の手動実行で作成した候補です。"
            echo
            echo "**mainへは自動反映しません。Preview / 差分確認後に判断してください。**"
            echo
            cat /tmp/game-director-result.md
          } > /tmp/game-director-pr.md
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "AI Game Director: ${TITLE}" \
            --body-file /tmp/game-director-pr.md

      - name: Summarize result
        if: ${{ always() && env.RUN_MODE == 'implement' }}
        run: |
          if [ -f /tmp/game-director-result.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/game-director-result.md >> "$GITHUB_STEP_SUMMARY"
          fi
